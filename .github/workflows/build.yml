name: build
on: [push, pull_request]

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release gate
        shell: pwsh
        run: ./tests/Release-Gate.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Package
        shell: pwsh
        run: ./tools/Build-Release.ps1 -RequireInstaller